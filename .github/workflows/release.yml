# Gera o instalador do Windows numa máquina limpa do GitHub.
# Rodar: aba Actions → "Gerar instalador" → Run workflow (ou criar uma tag v0.1.0 para virar Release).
name: Gerar instalador

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: FalaCMG-windows
          path: |
            dist/*.exe
            dist/*.zip
      # Em tags, publica um Release com os arquivos para baixar
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
